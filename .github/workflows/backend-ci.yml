name: Backend CI (Dev Branch)

# Trigger CI on push or pull request to dev branch
on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  backend-ci:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Get your code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          cd backend
          npm install

      # Step 4: Run ESLint
      - name: Run ESLint
        run: |
          cd backend
          npm run lint

      # Step 5: Optional TypeScript type check
      - name: TypeScript check
        run: |
          cd backend
          npx tsc --noEmit
